model:
  base_learning_rate: 4.5e-06
  target: core.models.transformer.Transformer
  params:
    clip_model_name: "ViT-B/32"  # <--- [可選新增]
    # ckpt_path: ckpts/places256_transformer.ckpt
    cond_stage_key: segmentation
    attention_extent: mask
    mask_on_latent: true # set this to true during training only 
    transformer_config:
      target: core.modules.transformer.mingpt.GPT
      params:
        vocab_size: 1025
        block_size: 257  # 257
        # n_layer: 40 # 24,40
        n_layer: 12 # 24,40
        # n_head: 16
        n_head: 8
        # n_embd: 1408
        n_embd: 768
        embd_pdrop: 0.1
        resid_pdrop: 0.1
        attn_pdrop: 0.1
        context_dim: 512 # <--- 確保這個存在且值正確

    first_stage_config:
      target: core.models.vqgan.VQModel
      params:
        ckpt_path: ./ckpts/places256_vqgan1024_BASE.ckpt
        embed_dim: 256
        n_embed: 1024
        ddconfig:
          padding_free: false
          double_z: false
          z_channels: 256
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
          - 1
          - 1
          - 2
          - 2
          - 4
          num_res_blocks: 2
          attn_resolutions:
          - 16
          dropout: 0.0
        lossconfig:
          target: core.modules.losses.DummyLoss
    cond_stage_config: "__is_unconditional__"

data:
  target: train.DataModuleFromConfig
  params:
    batch_size: 1
    num_workers: 4 # <--- 嘗試添加或調整這個值
    train:
      target: core.data.places365.Places
      params:
        dataroot: ./dataset/ 
        annotations_filepath: ./annotations/football_annotations_v1.csv # <--- 修改為您的 CSV 文件路徑
        crop_size: 256
        rescale: True
        rescale_size: 256
        split: 'train'
    test:
      target: core.data.places365.Places
      params:
        dataroot: ./dataset/
        annotations_filepath: ./annotations/football_annotations_v1.csv # <--- 測試/驗證集也需要標註文件
        # maskroot: /home/chenh/data/masks_val_512_eval
        crop_size: 256
        rescale: True
        rescale_size: 256
        split: 'test'

lightning:
  trainer:
    gpus: "0,"  # 或者根據您的情況設置，也可以在命令列覆蓋
    accelerator: gpu
    # strategy: ddp # 或者 "auto" 讓 Lightning 自動選擇單 GPU 策略
    # devices: 1 # 通常由 gpus 參數推斷
    max_epochs: 20 # 您期望的 dryrun epoch 數
    limit_train_batches: 10 # 您期望的 dryrun 訓練批次數
    limit_val_batches: 2  # 您期望的 dryrun 驗證批次數
    accumulate_grad_batches: 4 # 梯度累積步數
    # distributed_backend: ddp # 通常 Lightning 會自動選擇